<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/mainTheme.css">
    <link rel="stylesheet" href="../css/dmViewTheme.css">
    <link rel="stylesheet" href="../css/barStack.css">
    <title>Editor do Mestre | Origin New Horizons DM Experience</title>
</head>

<body>
    <div class="main">
        <div id="barStackList"></div>
        <div class="map" id="mapHandler">
            <img id="mapImageHandler" class="map-item" src="../assets/preLoaded/maps/nothing.png" alt=""
                draggable="false">
            <div class="camera-frame" id="cameraFrameHandler" hidden></div>
        </div>
    </div>

    <div class="controls-menu" id="menuHandler">
        <div class="menu-content">
            <div class="active-players" id="membersHandler">

            </div>

            <div class="parent" id="selectsContainer">

            </div>

            <label class="camera-toggle">
                <input type="checkbox" id="cameraToggleHandler">
                <span>Modo Câmera</span>
            </label>
            <div id="barStackController">
                <button class="bs-btn bs-reset" type="button">Zerar rodadas</button>
            </div>

            <button class="bs-btn" style=" width: 120px;" onclick="DeactivateCutscene()">desligar cutscene</button>
            <button class="bs-btn" style=" width: 120px;" onclick="FadeIn()">fade in</button>
            <button class="bs-btn" style=" width: 120px;" onclick="FadeOut()">fade out</button>
        </div>
    </div>

    <div class="enemy-controls-menu" id="enemyMenuHandler">
        <div class="menu-content">
            <div class="active-enemies" id="enemiesHandler">

            </div>
        </div>
    </div>

    <button class="menu-toggle" id="toggleHandler" onclick="PushMenu()">❯</button>
    <button class="enemy-menu-toggle" id="secondToggleHandler" onclick="PushEnemyMenu()">❮</button>
</body>

<script src="../js/main.js"></script>
<script src="../js/bars/barStackController.js"></script>

</html>
